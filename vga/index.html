<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio</title>
</head>
<body>
    <h2 id="musica">Uma musica que gosto</h2>
    <p>escolhi esta faixa instrumental para acompanhar meus estudos</p>
    <audio controls autoplay muted preload="metadata" src="mars.mp3" type="audio/mp3">
        seu navegador não oferece suporte ao elemento audio
    </audio>
    <p><a href="mars.mp3">Abrir o arquivo de audio</a></p>
    <h2 id="video">meu projeto em video</h2>
    <video controls preload="metadata" width="640" poster="mars.png" playsinline>
        <source src="istockphoto-mars.mp4" type="video/mp4">
    </video>
</body>
</html>
